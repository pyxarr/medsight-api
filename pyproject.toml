[project]
name = "medsight-api"
version = "0.1.0"
description = "Intelligent Decision Support System for Breast Cancer Risk Assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "pandas",
    "numpy",
    "joblib",
    "fastapi",
    "uvicorn",
    "shap>=0.51.0",
    "requests>=2.32.5",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "supabase>=2.29.0",
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml", "api"]
