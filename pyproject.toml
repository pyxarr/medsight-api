[project]
name = "breast-cancer-dss"
version = "0.1.0"
description = "Intelligent Decision Support System for Breast Cancer Risk Assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "pandas",
    "numpy",
    "joblib",
    "fastapi",
    "uvicorn",
    "shap>=0.51.0",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml", "api"]
